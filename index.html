:root{--bur:#5e1426;--bur2:#7d1f36;--ivo:#f6efe0;--oro:#c9a96a;--ros:#d9a5a8;--ver:#1f3a2e}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;color:var(--ivo);font:400 1.15rem/1.65 'Cormorant Garamond',Georgia,serif;background:radial-gradient(120% 90% at 50% 0,#4a1020 0,#1b0a10 55%,#10201a 100%) fixed}
#nieve{position:fixed;inset:0;pointer-events:none;z-index:2;opacity:.82}
#app{position:relative;z-index:1;max-width:880px;margin:0 auto;padding:20px 16px 96px}
.vista{animation:ap .8s ease both}@keyframes ap{from{opacity:0}}
h1,h2,h3{font-family:'Pinyon Script','Cormorant Garamond',cursive;font-weight:400;margin:.2em 0;line-height:1.15}
h1{font-size:clamp(3.2rem,14vw,6.2rem);color:var(--oro);text-shadow:0 0 34px #c9a96a55}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--oro);outline-offset:2px}
.portada{text-align:center;padding-top:3vh}
.ilus{width:min(100%,460px)}
.sup{color:var(--ros);letter-spacing:.2em;margin:0}
.sub{font-style:italic;font-size:1.35rem;max-width:30ch;margin:.4em auto 0}
.hero{width:min(100%,620px);margin:0 auto -.3rem;aspect-ratio:4/3;-webkit-mask-image:radial-gradient(ellipse 72% 78% at 50% 42%,#000 58%,transparent 100%);mask-image:radial-gradient(ellipse 72% 78% at 50% 42%,#000 58%,transparent 100%)}
.hero svg,.hero img{display:block;width:100%;height:100%;object-fit:cover}
.nv{fill:#f6efe0}@keyframes cae{0%{opacity:0;transform:translateY(0)}10%,90%{opacity:.9}100%{opacity:0;transform:translateY(230px)}}
.tw{animation:twinkle 3.6s ease-in-out infinite;will-change:opacity}
@keyframes twinkle{0%,100%{opacity:.55}50%{opacity:1}}
.fl{animation:flame 1.05s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%;will-change:transform,opacity;filter:drop-shadow(0 0 3px #ffb347)}
@keyframes flame{0%{transform:translate(0,0) rotate(-5deg) scale(.88,1.02);opacity:.82}35%{transform:translate(1px,-1px) rotate(4deg) scale(1.08,.94);opacity:1}70%{transform:translate(-.8px,-1.5px) rotate(-3deg) scale(.94,1.16);opacity:.9}100%{transform:translate(.5px,-.5px) rotate(6deg) scale(1.04,1.05);opacity:1}}
.candle-glow{opacity:.5}
@keyframes glow{from{opacity:.28;transform:scale(.82)}to{opacity:.72;transform:scale(1.18)}}
.moon-glow{animation:moonlight 6s ease-in-out infinite alternate}
.moon-disc{animation:moondisc 4.2s ease-in-out infinite alternate;filter:drop-shadow(0 0 5px #fff1c5)}

.window-light{opacity:.12}

.dedic{max-width:20em;margin:1.3em auto 1.6em;padding:.8em 0 .9em;border-block:1px solid #c9a96a55}
.dedic::before{content:'✦';display:block;color:var(--oro);font-size:.8rem}

.hoja::after{content:'';position:absolute;right:10%;top:56%;width:6px;height:6px;border-radius:50%;background:var(--oro)}

.abierta .hoja{transform:rotateY(-68deg)}
.puerta:disabled{cursor:not-allowed;filter:saturate(.5) brightness(.7)}
.puerta u{position:absolute;bottom:11%;left:0;right:0;text-decoration:none;font-size:.9rem;z-index:1}
.final{box-shadow:0 0 0 3px var(--oro),0 0 26px #e8c27acc}

.papel h2{color:var(--bur2);font-size:2.6rem;text-align:center}
.papel h3{color:var(--ver);font-size:1.9rem}
.prov{display:block;width:max-content;margin:0 auto 8px;font-size:.85rem;font-style:italic;color:#8a5a2b;background:#e8c27a55;padding:.1em .9em;border-radius:99px}
.carta p{text-indent:1.5em;margin:.5em 0}
.fila{display:flex;gap:8px;flex-wrap:wrap}
.fila input{flex:1;min-width:140px;font:inherit;padding:.5em .9em;border:1px solid var(--oro);border-radius:8px;background:#fff9}
.op{display:block;width:100%;margin:.4em 0;padding:.6em;border:1px solid var(--oro);border-radius:8px;background:#fff8;color:inherit}
.bien{background:#cfe3d3}.mal{background:#f0c9cc}
.res{min-height:1.6em;color:var(--bur2);font-style:italic;text-align:center}
.marco{aspect-ratio:4/3;display:grid;place-items:center;border:2px dashed var(--oro);border-radius:6px;color:#8a6d3b;text-align:center;padding:1em}

/* Las animaciones decorativas de la portada se mantienen activas. */

function portada(){app.innerHTML=`<section class="vista portada"><div class="hero">${C.portadaImagen?`<img src="${esc(C.portadaImagen)}" alt="">`:SVG}</div><p class="sup">Diciembre ${C.anio}</p><h1>${esc(C.titulo)}</h1><p class="sub">${esc(C.subtitulo)}</p><div class="dedic"><p class="para">${esc(C.dedicatoria)}</p><p class="firma">${esc(C.firma||'')}</p></div><button class="btn" data-go="cal">Entrar al calendario</button></section>`;scrollTo(0,0)}

function cal(){const n=vistos.length;
app.innerHTML=`<section class="vista"><div class="cab"><button class="atras" data-go="portada">‹ Portada</button><h2>Diciembre</h2><span style="width:5em"></span></div>${C.modoPrueba?'<p class="aviso">Modo prueba: todas las puertas están abiertas.</p>':''}<div class="prog"><span>${n} de 24 sorpresas abiertas</span><i><b style="width:${n/24*100}%"></b></i></div><div class="rejilla">${Array.from({length:24},(_,i)=>{const d=i+1,ok=libre(d);return `<button class="puerta c${i%4}${vistos.includes(d)?' abierta':''}${d==24?' final':''}" data-d="${d}" ${ok?'':'disabled'} aria-label="Día ${d}${ok?'':', bloqueado hasta el '+d+' de diciembre'}"><span class="hoja"><em>${d}</em></span>${ok?'':'<u>🔒</u>'}</button>`}).join('')}</div></section>`;scrollTo(0,0)}

const med=(x,t)=>x.archivo?`<${t} controls preload="none" src="${esc(x.archivo)}"></${t}>`:`<div class="marco">Aquí irá ${t=='audio'?'el audio':'el vídeo'}</div>`;
const T={
carta:x=>`<div class="carta">${P(x.texto)}</div>`,
foto:x=>`<figure>${x.imagen?`<img src="${esc(x.imagen)}" alt="${esc(x.pie)}">`:'<div class="marco">Aquí irá vuestra fotografía</div>'}<figcaption>${esc(x.pie)}</figcaption></figure>`,
fotos:x=>`<p>${esc(x.texto||'')}</p><div class="galeria">${x.imagenes.map(im=>`<figure><img src="${esc(im.src)}" alt="${esc(im.alt||'Fotografía nuestra')}" loading="lazy"><figcaption>${esc(im.pie||'')}</figcaption></figure>`).join('')}</div>`, 
quiz:x=>`<p>${esc(x.pregunta)}</p>${x.opciones.map((o,i)=>`<button class="op" data-i="${i}">${esc(o)}</button>`).join('')}<p class="res"></p>`,
acertijo:x=>`<p>${esc(x.pregunta)}</p><div class="fila"><input aria-label="Tu respuesta"><button class="btn">Probar</button><button class="btn suave" data-h>Pista</button></div><p class="res"></p>`,
memoria:x=>`<p>Encuentra las parejas.</p><div class="mem">${mez([...x.pares,...x.pares]).map(k=>`<button class="m" data-k="${esc(k)}" aria-label="Carta">${esc(k)}</button>`).join('')}</div><p class="res"></p>`,
puzzle:()=>`<p>Toca las piezas en el orden correcto para formar la frase.</p><div class="orden"></div><div class="bandeja"></div><p class="res"></p>`,
audio:x=>`<p>${esc(x.texto)}</p>${med(x,'audio')}`,
video:x=>`<p>${esc(x.texto)}</p>${med(x,'video')}`,
reto:x=>`<p>${esc(x.texto)}</p><p style="text-align:center"><button class="btn">Reto cumplido ✓</button></p><p class="res"></p>`};
const B={
quiz:(r,x)=>r.querySelectorAll('.op').forEach(b=>b.onclick=()=>{const ok=+b.dataset.i===x.correcta;b.className='op '+(ok?'bien':'mal');r.querySelector('.res').textContent=ok?x.acierto:x.fallo}),
acertijo:(r,x)=>{const res=r.querySelector('.res');r.querySelector('.btn').onclick=()=>res.textContent=norm(r.querySelector('input').value)===norm(x.respuesta)?'¡Exacto! ✨':'Casi… inténtalo otra vez.';r.querySelector('[data-h]').onclick=()=>res.textContent='Pista: '+x.pista},
reto:r=>r.querySelector('.btn').onclick=()=>r.querySelector('.res').textContent='Qué bonito, uno más para la colección 💕',
memoria:(r,x)=>{let a=null,lock=false,n=0;const res=r.querySelector('.res');
r.querySelectorAll('.m').forEach(c=>c.onclick=()=>{if(lock||c.classList.contains('v'))return;c.classList.add('v');if(!a){a=c;return}
if(a.dataset.k===c.dataset.k){a=null;if(++n==x.pares.length)res.textContent='¡Las encontraste todas! 💞'}else{lock=true;const p=a;a=null;setTimeout(()=>{p.classList.remove('v');c.classList.remove('v');lock=false},800)}})},
puzzle:(r,x)=>{const ord=mez(x.piezas.map((t,i)=>({t,i}))),res=r.querySelector('.res');let s=[];
const pn=()=>{r.querySelector('.bandeja').innerHTML=ord.filter(o=>!s.includes(o.i)).map(o=>`<button data-i="${o.i}">${esc(o.t)}</button>`).join('');
r.querySelector('.orden').innerHTML=s.map(i=>`<button data-q="${i}">${esc(x.piezas[i])}</button>`).join('')||'<small>Tus piezas aparecerán aquí</small>';
res.textContent=s.length<ord.length?'':s.every((v,k)=>v==k)?'¡Perfecto, lo has ordenado! 💫':'Algo no encaja… toca una pieza para quitarla.'};
r.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if('i' in b.dataset)s.push(+b.dataset.i);else if('q' in b.dataset)s=s.filter(v=>v!=b.dataset.q);else return;pn()});pn()}
};

function final(){const f=C.final;return `<h2>El último secreto de Navidad</h2><p style="text-align:center;font-style:italic">Tres pruebas, tres fragmentos y una contraseña que lo abrirá todo.</p>
${f.pruebas.map((p,i)=>`<div class="prueba" data-p="${i}"><h3>Prueba ${i+1}: ${esc(p.titulo)}</h3><p>${esc(p.pregunta)}</p><div class="fila"><input aria-label="Respuesta"><button class="btn">Probar</button><button class="btn suave" data-h>Pista</button></div><p class="res"></p></div>`).join('')}
<div class="prueba"><p>Fragmentos reunidos: <b id="fr">${f.pruebas.map(()=>'·').join(' ')}</b></p><div class="fila"><input id="cl" aria-label="Contraseña final" placeholder="Contraseña final"><button class="btn" id="ab">Abrir</button></div><p class="res" id="rc"></p></div>
<div id="tes" hidden><h3>Para ti</h3><div class="carta">${P(f.carta)}</div>${f.imagen?`<img src="${esc(f.imagen)}" alt="">`:'<div class="marco">Aquí irá tu sorpresa final</div>'}<p style="text-align:center">${esc(f.sorpresa)}</p></div>`}
function iniFinal(r){const f=C.final,fr=f.pruebas.map(()=>'·'),ok=f.pruebas.map(()=>false);
r.querySelectorAll('.prueba[data-p]').forEach(el=>{const i=+el.dataset.p,p=f.pruebas[i],res=el.querySelector('.res');
el.querySelector('.btn').onclick=()=>{if(norm(el.querySelector('input').value)===norm(p.respuesta)){ok[i]=true;fr[i]=p.fragmento;r.querySelector('#fr').textContent=fr.join(' ');res.textContent='¡Prueba superada! Fragmento: '+p.fragmento}else res.textContent='Aún no… prueba otra vez.'};
el.querySelector('[data-h]').onclick=()=>res.textContent='Pista: '+p.pista});
r.querySelector('#ab').onclick=()=>{const rc=r.querySelector('#rc');
if(!ok.every(Boolean))return rc.textContent='Primero supera las tres pruebas.';
if(norm(r.querySelector('#cl').value)!==norm(f.clave))return rc.textContent='Esa no es la contraseña. Junta bien los fragmentos.';
rc.textContent='¡Se abrió! 🎄';const t=r.querySelector('#tes');t.hidden=false;t.scrollIntoView({behavior:'smooth'})}}

const audioOriginal='Quan%20somrius%20amb%20lletra%20-%20malkei66.mp3';
function cambiarMusica(archivo){
  const audio=$('#audio-fondo');
  const estabaSonando=!audio.paused;
  const actual=audio.getAttribute('src')||audio.querySelector('source')?.getAttribute('src')||'';
  if(actual===archivo)return;
  audio.pause();
  audio.removeAttribute('src');
  const fuente=audio.querySelector('source');
  if(fuente)fuente.remove();
  audio.src=archivo;
  audio.load();
  if(estabaSonando)audio.play().catch(()=>{});
}

function dia(d){if(!vistos.includes(d)){vistos.push(d);guardar()}
cambiarMusica(d===2?C.dias[1].musica:audioOriginal);
const x=C.dias[d-1]||{tipo:'carta',titulo:'Día '+d,texto:''},tp=T[x.tipo]?x.tipo:'carta';
app.innerHTML=`<section class="vista"><div class="cab"><button class="atras" data-go="cal">‹ Calendario</button><span>${d} de diciembre</span></div><article class="papel">${C.demo?'<span class="prov">Contenido de ejemplo</span>':''}${d==24?final():`<h2>${esc(x.titulo)}</h2>${T[tp](x)}`}</article></section>`;
const r=app.querySelector('.papel');d==24?iniFinal(r):B[tp]?.(r,x);scrollTo(0,0)}

app.onclick=e=>{const b=e.target.closest('[data-go],[data-d]');if(!b||b.disabled)return;
if(b.dataset.d)dia(+b.dataset.d);else b.dataset.go=='cal'?cal():portada()};

const mus=$('#mus'),musicPlayer=$('#music-player'),audioFondo=$('#audio-fondo');
audioFondo.volume=0.22;
mus.onclick=()=>{const abrir=musicPlayer.hidden;musicPlayer.hidden=!abrir;mus.setAttribute('aria-expanded',String(abrir));mus.textContent=abrir?'♫ Ocultar música':'♫ Mostrar música'};

(()=>{const c=$('#nieve'),g=c.getContext('2d');let w,h,raf;
const rs=()=>{const d=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=Math.round(w*d);c.height=Math.round(h*d);c.style.width=w+'px';c.style.height=h+'px';g.setTransform(d,0,0,d,0,0)};rs();addEventListener('resize',rs);
// Copos en tres profundidades para dar sensación de distancia.
const f=Array.from({length:115},(_,i)=>({x:Math.random()*w,y:Math.random()*h,r:i<65?.7+Math.random()*1.2:1.4+Math.random()*2.3,v:i<65?.25+Math.random()*.35:.45+Math.random()*.8,s:Math.random()*6,drift:(Math.random()-.5)*.35,a:i<65?.35:.78,phase:Math.random()*6}));
function t(){g.clearRect(0,0,w,h);f.forEach(p=>{p.y+=p.v;p.s+=.009+p.r*.002;p.x+=Math.sin(p.s+p.phase)*(.18+p.r*.12)+p.drift*.12;if(p.y>h+8){p.y=-8;p.x=Math.random()*w}if(p.x>w+8)p.x=-8;if(p.x< -8)p.x=w+8;g.beginPath();g.fillStyle=`rgba(255,249,235,${p.a})`;g.shadowColor='rgba(255,239,210,.55)';g.shadowBlur=p.r>2?5:1.5;g.arc(p.x,p.y,p.r,0,Math.PI*2);g.fill()});g.shadowBlur=0;raf=requestAnimationFrame(t)}t();
// Pausa la animación cuando la pestaña no está visible.
document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(raf);raf=0}else if(!raf)t()});
})();

portada();
</script>
